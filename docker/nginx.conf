worker_processes auto;
pid /tmp/nginx.pid;
daemon off;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 25m;

    server {
        # PORT is substituted by entrypoint.sh at container start —
        # Railway assigns this dynamically and it's not known at build time.
        listen __PORT__;
        server_name _;
        root /var/www/html/public;
        index index.html index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }

        location = /up {
            try_files $uri /index.php?$query_string; # Laravel's built-in health check route
        }
    }
}
