expose_php = Off
memory_limit = 256M
upload_max_filesize = 25M
post_max_size = 25M
max_execution_time = 120

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 128

; Never let error output leak internals — errors go to the log, not the response.
display_errors = Off
log_errors = On
