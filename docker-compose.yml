# Hostinger VPS (or any Docker host).
#   cp .env.example .env    # fill APP_KEY, DB_*, APP_DOMAIN, ADMIN_*, provider keys
# PostgreSQL:  set DB_CONNECTION=pgsql DB_HOST=postgres DB_PORT=5432
#              docker compose --profile postgres up -d --build
# MySQL:       set DB_CONNECTION=mysql DB_HOST=mysql    DB_PORT=3306
#              docker compose --profile mysql up -d --build
services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: "8080"
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: ""
      REDIS_HOST: redis
      REDIS_URL: ""
    restart: unless-stopped   # retries until the database container is ready

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes: [mysqldata:/var/lib/mysql]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  pgdata:
  mysqldata:
  redisdata:
  caddydata:
